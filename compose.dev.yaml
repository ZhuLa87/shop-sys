# 開發環境 override:原始碼掛載 + hot reload
#
# backend  掛載整個專案,容器內跑 mvn spring-boot:run.
#          spring-boot-devtools 監看 target/classes,所以在"主機端"重新編譯
#          (IDE 自動編譯,或 ./mvnw compile) 就會觸發容器內自動重啟.
# frontend 容器內跑 nuxt dev,Vite HMR 走 websocket 經由 nginx 轉發.
#
# 另外開出除錯用埠號,方便用 DBeaver 直接連資料庫;
# RedisInsight 與 MinIO Console 這兩個管理網頁則一律走 TLS,不以明文對外.

services:
    mariadb:
        ports:
            - "${DEBUG_DB_PORT:-13306}:3306"

    redis:
        ports:
            - "${DEBUG_REDIS_PORT:-16379}:6379"

    minio:
        environment:
            # Console 掛在 nginx 後面,登入後的重導向必須指回對外網址,
            # 否則會被導到容器內部的 http://minio:9001
            MINIO_BROWSER_REDIRECT_URL: https://${PUBLIC_HOST}:${NGINX_MINIO_CONSOLE_PORT:-8445}

    # Console 管理介面走 nginx 終結 TLS (見 docker/nginx/templates/minio-console.conf.template) .
    # 這個 override 只在 dev 掛載,staging / prod 不會對外開放 Console.
    nginx:
        ports:
            - "${NGINX_MINIO_CONSOLE_PORT:-8445}:${NGINX_MINIO_CONSOLE_PORT:-8445}"
        environment:
            NGINX_MINIO_CONSOLE_PORT: ${NGINX_MINIO_CONSOLE_PORT:-8445}
        volumes:
            # 只有 dev 掛這份設定,所以 staging / prod 不會對外開放 Console
            - ./docker/nginx/templates/minio-console.conf.template:/etc/nginx/templates/minio-console.conf.template:ro
        depends_on:
            minio:
                condition: service_healthy

    # Redis 的網頁管理介面.dev 專用,staging / prod 不會有這個服務.
    # 綁在 0.0.0.0 方便從其他電腦經由 tailscale 連進來,因此掛上憑證自行終結 TLS,
    # 不讓 Redis 內容以明文在網路上傳輸.
    # (MinIO Console 目的相同但做法不同:它的 TLS 是 server 層級,一開會連 S3 API
    #  一起變成 HTTPS,所以改為收在 nginx 後面,見上面的 nginx override) 
    redisinsight:
        image: redis/redisinsight:latest
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - "${DEBUG_REDISINSIGHT_PORT:-15540}:5540"
        environment:
            TZ: ${TZ:-Asia/Taipei}
            RI_SERVER_TLS_CERT: /certs/${TLS_CERT_FILE}
            RI_SERVER_TLS_KEY: /certs/${TLS_KEY_FILE}
        # 連線需首次開啟時手動新增一次 (host: redis, port: 6379, 密碼見 env/.env.dev) ,
        # 之後存在 redisinsight-data volume 裡不會消失.
        # RI_REDIS_* 那組變數只對 Redis Stack 單庫模式有效,一般模式不會生效 (已實測) ;
        # 唯一可行的預設機制 RI_PRE_SETUP_DATABASES_PATH 需要把密碼寫進掛載的 JSON,
        # 為了一次性的便利不值得為此多一層產生設定檔的機制
        volumes:
            - redisinsight-data:/data
            - ${TLS_CERT_DIR}:/certs:ro
        networks: [shop-sys-net]

    backend:
        build:
            context: .
            dockerfile: docker/backend/Dockerfile.dev
            args:
                DEV_UID: ${DEV_UID:-1000}
                DEV_GID: ${DEV_GID:-1000}
        # 以主機使用者的 uid 執行,否則 maven 寫進 target/ 的檔案會變成 root 所有,
        # 主機上再跑 ./mvnw 就會因權限不足而失敗
        user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
        volumes:
            - .:/workspace
            # Maven 本機倉庫用具名 volume 快取,避免每次重建都重新下載相依
            - maven-repo:/home/dev/.m2
        environment:
            # devtools 在容器內需要放寬輪詢間隔,避免掛載檔案系統事件不可靠
            SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
            SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
        # 掛載原始碼後首次啟動要編譯,啟動時間較長
        healthcheck:
            start_period: 240s

    frontend:
        build:
            context: ./frontend
            dockerfile: ../docker/frontend/Dockerfile.dev
        volumes:
            - ./frontend:/app
            # node_modules 用具名 volume,不讓主機上的版本覆蓋容器內安裝的結果
            - frontend-node-modules:/app/node_modules
            - frontend-nuxt-cache:/app/.nuxt
            - frontend-pnpm-store:/home/node/.pnpm-store
        environment:
            NODE_ENV: development
            # Vite 需要放行經由 nginx 轉發進來的 Host 標頭
            NUXT_DEV_ALLOWED_HOST: ${PUBLIC_HOST}

volumes:
    maven-repo:
    frontend-node-modules:
    frontend-nuxt-cache:
    frontend-pnpm-store:
    redisinsight-data:
