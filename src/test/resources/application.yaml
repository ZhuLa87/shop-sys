spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=value
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate: {}
  security:
    user:
      name: test
      password: test

server:
  port: 0

jwt:
  secret: testSecretKeyForShopSYSThatIsLongEnoughForHS512Algorithm
  expiration: 1800000
  refresh-expiration: 604800000

app:
  security:
    account-locking:
      enabled: false
      max-failed-attempts: 5
      lock-duration-minutes: 15
      reset-failure-count-minutes: 60
      auto-unlock: true

logging:
  level:
    root: WARN
    com.zzowo.shop_sys: INFO
