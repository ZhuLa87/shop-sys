spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=value
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 單元測試的 schema 由 Hibernate create-drop 直接從 entity 產生,
  # 不跑 Flyway (migration 是 MariaDB 方言,無法套用在 H2 上)
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate: {}
  security:
    user:
      name: test
      password: test
  data:
    redis:
      host: tu-zhu.soay-fish.ts.net
      port: 6379

server:
  port: 0

jwt:
  secret: testSecretKeyForShopSYSThatIsLongEnoughForHS512Algorithm
  expiration: 1800000
  refresh-expiration: 604800000

app:
  security:
    account-locking:
      enabled: false
      max-failed-attempts: 5
      lock-duration-minutes: 15
      reset-failure-count-minutes: 60
      auto-unlock: true

minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: test-bucket
  public-url: http://localhost:9000

logging:
  level:
    root: WARN
    com.zzowo.shop_sys: INFO
